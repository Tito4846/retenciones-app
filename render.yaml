# Blueprint de Render: en el panel, New → Blueprint y elegir este repositorio.
# Un solo servicio Docker sirve la API y el front en el mismo dominio.
services:
  - type: web
    name: retenciones
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # El disco persistente necesita un plan pago (no existe en el plan free).
    plan: starter
    region: oregon
    healthCheckPath: /api/salud
    autoDeploy: true
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Se completan a mano en el panel de Render (no quedan en git).
      # El mismo valor que RETENCIONES_MODULO_SECRETO en el servicio de ContadorWeb.
      - key: RETENCIONES_MODULO_SECRETO
        sync: false
      - key: EMPRESA
        sync: false
      - key: XUBIO_USUARIO
        sync: false
      - key: XUBIO_CLAVE
        sync: false
