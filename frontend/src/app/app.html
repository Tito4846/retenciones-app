<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="sticky top-0 flex h-screen w-72 shrink-0 flex-col border-r border-line bg-white">
    <div class="flex items-center gap-3 border-b border-line px-6 py-6">
      <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-700 text-white">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18" /><path d="m7 15 4-4 3 3 5-6" />
        </svg>
      </div>
      <div class="leading-tight">
        <p class="font-semibold">Conciliación</p>
        <p class="text-sm text-brand-600">Retenciones ARCA</p>
      </div>
    </div>

    <nav class="flex-1 px-4 py-6">
      <p class="mb-3 px-3 text-xs font-semibold tracking-wider text-muted uppercase">Operación</p>
      <ul class="space-y-1">
        <li>
          <a
            routerLink="/importar"
            routerLinkActive="bg-brand-50 text-brand-700"
            class="flex items-center gap-3 rounded-lg px-3 py-3 text-ink/90 transition-colors hover:bg-brand-50"
          >
            <svg class="h-5 w-5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /><path d="M12 17v-6" /><path d="m9 14 3-3 3 3" />
            </svg>
            Importar archivos
          </a>
        </li>
        <li>
          <a
            routerLink="/conciliacion"
            routerLinkActive="bg-brand-50 text-brand-700"
            class="flex items-center gap-3 rounded-lg px-3 py-3 text-ink/90 transition-colors hover:bg-brand-50"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-15-6.7L3 8" /><path d="M3 3v5h5" /><path d="M3 12a9 9 0 0 0 15 6.7l3-2.7" /><path d="M21 21v-5h-5" />
            </svg>
            Conciliación
          </a>
        </li>
        <li>
          <a
            routerLink="/revision"
            routerLinkActive="bg-brand-50 text-brand-700"
            class="flex items-center gap-3 rounded-lg px-3 py-3 text-ink/90 transition-colors hover:bg-brand-50"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
            Revisión
            @if (revisiones.pendientes()) {
              <span class="ml-auto rounded-full bg-amber-500 px-2 py-0.5 text-xs font-semibold text-white tabular-nums" title="Sin aprobar">{{ revisiones.pendientes() }}</span>
            }
          </a>
        </li>
      </ul>

      <p class="mt-8 mb-3 px-3 text-xs font-semibold tracking-wider text-muted uppercase">Configuración</p>
      <ul class="space-y-1">
        <li>
          <a
            routerLink="/conexiones"
            routerLinkActive="bg-brand-50 text-brand-700"
            class="flex items-center gap-3 rounded-lg px-3 py-3 text-ink/90 transition-colors hover:bg-brand-50"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 2v6" /><path d="M15 2v6" /><path d="M12 17v5" /><path d="M5 8h14v3a7 7 0 0 1-14 0z" />
            </svg>
            Conexiones
          </a>
        </li>
      </ul>
    </nav>

    <div class="border-t border-line px-6 py-5 text-xs text-muted">
      <p>Retenciones ARCA vs. Mayor Xubio</p>
      <p class="mt-1">V-1.0.0</p>
    </div>
  </aside>

  <!-- Contenido -->
  <main class="min-w-0 flex-1 px-10 py-10">
    <router-outlet />
  </main>
</div>
